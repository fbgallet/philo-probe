<text x="24" y="34" font-size="16" font-weight="600" fill="#1c1917">Les auteurs cités, et ceux avec qui l'on raisonne</text>
<text x="24" y="444" font-size="11" fill="#78716c">Condition nue, ton neutre. Mentions, et part où un argument de l'auteur est réellement mobilisé.</text>
