<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 460" width="610" height="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Les auteurs cités, et ceux avec qui l'on raisonne">
