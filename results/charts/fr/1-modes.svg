<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 346" width="820" height="346" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Le mode dominant de la réponse, selon ce sur quoi porte la question">
<title>Le mode dominant de la réponse, selon ce sur quoi porte la question</title>
<rect width="820" height="346" fill="#ffffff"/>
<text x="24" y="34" font-size="16" font-weight="600" fill="#1c1917">Le mode dominant de la réponse, selon ce sur quoi porte la question</text>
<text x="24" y="330" font-size="11" fill="#78716c">Part des réponses ; condition nue, ton neutre. Un problème nommé fait raisonner ; une situation vécue fait conseiller.</text>
