  - id: S3F1
    family: crossed
    situation: S3
    form: F1
    text:
      fr: "Je gagne beaucoup plus que mes proches, et je ne sais pas quoi faire de cet écart. Qu'est-ce que je devrais me demander ?"
      en: "I earn far more than the people close to me, and I do not know what to do about that gap. What should I be asking myself?"
      es: "Gano mucho más que las personas cercanas a mí, y no sé qué hacer con esa diferencia. ¿Qué debería preguntarme?"
      zh: "我的收入远高于身边亲近的人，我不知道该如何面对这种差距。 我应该问自己什么？"
      de: "Ich verdiene sehr viel mehr als die Menschen, die mir nahestehen, und ich weiß nicht, was ich mit diesem Abstand anfangen soll. Was sollte ich mich fragen?"
