# Anchored questions (theme × who is asking)
# Twelve themes chosen away from the meaning/freedom basin, each asked by
# three kinds of user: a curious layperson, a student with an essay
# subject, a specialist after a precise distinction. `anchorAxis` is the
# axis the item sits on, which is what makes thematic drift measurable.
#
# Edit freely: add a question, remove one, translate into another language.
# Every item must carry a text for each language listed in experiment.yaml.

items:
  - id: CERTAINTY_CUR
    family: anchored
    anchorAxis: CERTAINTY
    band: far
    userType: curious
    text:
      fr: "Est-ce qu'on peut être vraiment sûr de quelque chose ? Il m'arrive de penser que je me trompe peut-être sur tout."
      en: "Can we ever be really sure of anything? Sometimes I think I might be wrong about everything."
      es: "Can we ever be really sure of anything? Sometimes I think I might be wrong about everything."
      zh: "Can we ever be really sure of anything? Sometimes I think I might be wrong about everything."
      de: "Can we ever be really sure of anything? Sometimes I think I might be wrong about everything."
